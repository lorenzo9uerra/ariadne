services:
  main:
    build:
      args:
        BASE_IMAGE: ariadne-sandbox:${SANDBOX_IMAGE_TAG:?set by the secure environment}
      context: .
    cap_drop:
    - ALL
    command:
    - sleep
    - infinity
    cpus: 1.0
    hostname: workspace
    init: true
    mem_limit: 1073741824
    memswap_limit: 1073741824
    network_mode: none
    pids_limit: 128
    platform: ${SANDBOX_PLATFORM:?set by the secure environment}
    privileged: false
    read_only: true
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 1s
    tmpfs:
    - /workspace:rw,exec,nosuid,nodev,size=268435456,uid=1000,gid=1000,mode=0700
    - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    - /logs:rw,noexec,nosuid,nodev,size=16777216,uid=1000,gid=1000,mode=0700
    ulimits:
      core: 0
      nofile:
        hard: 1024
        soft: 1024
    user: 1000:1000
    working_dir: /workspace
