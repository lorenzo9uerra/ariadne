name: Explore

# The property tests with new inputs, weekly and on request. It never runs on
# pull requests, so it cannot block a merge; a failure only shows here.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_DOCKER: "0"
      RUN_LIVE: "0"
      HYPOTHESIS_PROFILE: explore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Run unpaid tests with new inputs
        run: uv run --no-sync pytest -q
